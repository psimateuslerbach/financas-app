<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#F0AC57" />
      <stop offset="35%" stop-color="#D3812F" />
      <stop offset="70%" stop-color="#A85B20" />
      <stop offset="100%" stop-color="#6E3812" />
    </linearGradient>
    <radialGradient id="gloss" cx="50%" cy="10%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E4" />
      <stop offset="45%" stop-color="#F4E0AC" />
      <stop offset="100%" stop-color="#DFBD79" />
    </linearGradient>
    <linearGradient id="billBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C89A54" />
      <stop offset="100%" stop-color="#9C7038" />
    </linearGradient>
    <radialGradient id="coin" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF3D2" />
      <stop offset="45%" stop-color="#EFC066" />
      <stop offset="100%" stop-color="#B87F2E" />
    </radialGradient>
    <radialGradient id="seal" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F5919B" />
      <stop offset="45%" stop-color="#D42E3F" />
      <stop offset="100%" stop-color="#83121F" />
    </radialGradient>
    <filter id="dropBig" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#301A06" flood-opacity="0.5" />
    </filter>
    <filter id="dropSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#301A06" flood-opacity="0.45" />
    </filter>
    <clipPath id="roundClip">
      <rect x="0" y="0" width="512" height="512" rx="104" />
    </clipPath>
  </defs>

  <g clip-path="url(#roundClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)" />
    <rect x="0" y="0" width="512" height="512" fill="url(#gloss)" />
    <rect x="0" y="0" width="512" height="512" fill="none" stroke="#3E2109" stroke-opacity="0.35" stroke-width="6" />
  </g>

  <!-- cedula de tras -->
  <g filter="url(#dropSmall)" transform="rotate(11 256 256)">
    <rect x="112" y="184" width="304" height="180" rx="20" fill="url(#billBack)" stroke="#4E2C0E" stroke-width="3" />
  </g>

  <!-- cedula principal -->
  <g filter="url(#dropBig)" transform="rotate(-9 256 256)">
    <rect x="90" y="170" width="330" height="198" rx="22" fill="url(#bill)" stroke="#5A3414" stroke-width="4" />
    <rect x="92" y="172" width="326" height="30" rx="15" fill="#FFFFFF" opacity="0.35" />
  </g>

  <g transform="rotate(-9 256 256)">
    <rect x="104" y="184" width="302" height="170" rx="14" fill="none" stroke="#7A4E22" stroke-width="2" opacity="0.6" stroke-dasharray="1 6" stroke-linecap="round" />

    <path d="M118 322 C 150 302, 180 302, 210 322 S 270 342, 300 322" fill="none" stroke="#7A4E22" stroke-width="2" opacity="0.35" />
    <path d="M118 202 C 150 220, 180 220, 210 202 S 270 184, 300 202" fill="none" stroke="#7A4E22" stroke-width="2" opacity="0.35" />

    <g transform="translate(178 270)">
      <rect x="-44" y="-44" width="88" height="88" rx="8" fill="none" stroke="#7A4E22" stroke-width="4" opacity="0.5" transform="rotate(45)" />
      <rect x="-44" y="-44" width="88" height="88" rx="8" fill="none" stroke="#7A4E22" stroke-width="4" opacity="0.5" />
      <circle r="30" fill="url(#seal)" stroke="#FFFFFF" stroke-width="4" />
      <circle r="15" fill="none" stroke="#83121F" stroke-width="2.5" opacity="0.6" />
    </g>

    <!-- R$ com efeito de relevo: sombra, luz, preenchimento -->
    <text x="312" y="273" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" text-anchor="middle" dominant-baseline="central" transform="translate(2 3)" fill="#4A2A0F" opacity="0.55">R$</text>
    <text x="312" y="273" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" text-anchor="middle" dominant-baseline="central" transform="translate(-2 -2)" fill="#FFF6DE" opacity="0.5">R$</text>
    <text x="312" y="273" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#6B3812">R$</text>
  </g>

  <!-- moeda no canto, metalica -->
  <g filter="url(#dropSmall)" transform="translate(388 116)">
    <circle r="36" fill="url(#coin)" stroke="#5A3414" stroke-width="4" />
    <circle r="27" fill="none" stroke="#5A3414" stroke-width="2" opacity="0.6" />
    <path d="M-10 -22 A 30 30 0 0 1 20 -6" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.6" stroke-linecap="round" />
    <g transform="translate(0 1)">
      <rect x="-16" y="-21" width="32" height="42" rx="5" fill="#5A3414" />
      <rect x="-12" y="-17" width="24" height="11" rx="1.5" fill="#F3E2B8" />
      <rect x="-12" y="-1" width="6" height="6" rx="1.2" fill="#F3E2B8" />
      <rect x="-3" y="-1" width="6" height="6" rx="1.2" fill="#F3E2B8" />
      <rect x="6" y="-1" width="6" height="6" rx="1.2" fill="#F3E2B8" />
      <rect x="-12" y="8" width="6" height="6" rx="1.2" fill="#F3E2B8" />
      <rect x="-3" y="8" width="6" height="6" rx="1.2" fill="#F3E2B8" />
      <rect x="6" y="8" width="6" height="6" rx="1.2" fill="#F3E2B8" />
    </g>
  </g>

  <g clip-path="url(#roundClip)">
    <rect x="0" y="0" width="512" height="40" fill="#FFFFFF" opacity="0.22" />
  </g>
</svg>
