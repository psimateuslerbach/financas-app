<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0973F" />
      <stop offset="100%" stop-color="#8A4A1E" />
    </linearGradient>
    <linearGradient id="billBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C89A54" />
      <stop offset="100%" stop-color="#9C7038" />
    </linearGradient>
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="softBlurSmall" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <clipPath id="billClip">
      <rect x="90" y="170" width="330" height="198" rx="22" />
    </clipPath>
    <clipPath id="coinClip">
      <circle r="36" />
    </clipPath>
    <radialGradient id="seal" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#F5919B" />
      <stop offset="45%" stop-color="#D42E3F" />
      <stop offset="100%" stop-color="#83121F" />
    </radialGradient>
    <linearGradient id="calcBody" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#8A5A2E" />
      <stop offset="55%" stop-color="#5A3414" />
      <stop offset="100%" stop-color="#3A2009" />
    </linearGradient>
    <linearGradient id="calcScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF3" />
      <stop offset="100%" stop-color="#DCC384" />
    </linearGradient>
    <linearGradient id="calcKey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF1D6" />
      <stop offset="100%" stop-color="#E4C88C" />
    </linearGradient>
    <filter id="dropTiny" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#2A1608" flood-opacity="0.55" />
    </filter>
    <filter id="dropBig" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#301A06" flood-opacity="0.5" />
    </filter>
    <filter id="dropSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#301A06" flood-opacity="0.45" />
    </filter>
    <clipPath id="roundClip">
      <rect x="0" y="0" width="512" height="512" rx="104" />
    </clipPath>
  </defs>

  <g clip-path="url(#roundClip)">
    <rect x="0" y="0" width="512" height="512" fill="url(#bg)" />
    <rect x="0" y="0" width="512" height="512" fill="none" stroke="#3E2109" stroke-opacity="0.35" stroke-width="6" />
  </g>

  <!-- cedula de tras -->
  <g filter="url(#dropSmall)" transform="rotate(11 256 256)">
    <rect x="112" y="184" width="304" height="180" rx="20" fill="url(#billBack)" stroke="#4E2C0E" stroke-width="3" />
  </g>

  <!-- cedula principal: cor solida + mancha de luz desfocada em cima, como o balao do Messages -->
  <g filter="url(#dropBig)" transform="rotate(-9 256 256)">
    <rect x="90" y="170" width="330" height="198" rx="22" fill="#E8CC8E" stroke="#5A3414" stroke-width="4" />
    <g clip-path="url(#billClip)">
      <ellipse cx="255" cy="180" rx="210" ry="70" fill="#FFFFFF" opacity="0.75" filter="url(#softBlur)" />
      <ellipse cx="255" cy="400" rx="210" ry="80" fill="#7A5220" opacity="0.35" filter="url(#softBlur)" />
    </g>
  </g>

  <g transform="rotate(-9 256 256)">
    <rect x="104" y="184" width="302" height="170" rx="14" fill="none" stroke="#7A4E22" stroke-width="2" opacity="0.6" stroke-dasharray="1 6" stroke-linecap="round" />

    <path d="M118 322 C 150 302, 180 302, 210 322 S 270 342, 300 322" fill="none" stroke="#7A4E22" stroke-width="2" opacity="0.35" />
    <path d="M118 202 C 150 220, 180 220, 210 202 S 270 184, 300 202" fill="none" stroke="#7A4E22" stroke-width="2" opacity="0.35" />

    <g transform="translate(178 270)">
      <rect x="-44" y="-44" width="88" height="88" rx="8" fill="none" stroke="#7A4E22" stroke-width="4" opacity="0.5" transform="rotate(45)" />
      <rect x="-44" y="-44" width="88" height="88" rx="8" fill="none" stroke="#7A4E22" stroke-width="4" opacity="0.5" />
      <circle r="30" fill="url(#seal)" stroke="#FFFFFF" stroke-width="4" />
      <circle r="15" fill="none" stroke="#83121F" stroke-width="2.5" opacity="0.6" />
    </g>

    <!-- R$ com efeito de relevo: sombra, luz, preenchimento -->
    <text x="312" y="273" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" text-anchor="middle" dominant-baseline="central" transform="translate(2 3)" fill="#4A2A0F" opacity="0.55">R$</text>
    <text x="312" y="273" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" text-anchor="middle" dominant-baseline="central" transform="translate(-2 -2)" fill="#FFF6DE" opacity="0.5">R$</text>
    <text x="312" y="273" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#6B3812">R$</text>
  </g>

  <!-- moeda no canto: cor solida + mancha de luz desfocada, mesma tecnica da cedula -->
  <g filter="url(#dropSmall)" transform="translate(388 116)">
    <circle r="36" fill="#D9A94F" stroke="#5A3414" stroke-width="4" />
    <g clip-path="url(#coinClip)">
      <ellipse cx="-6" cy="-14" rx="30" ry="20" fill="#FFFFFF" opacity="0.8" filter="url(#softBlurSmall)" />
      <ellipse cx="8" cy="24" rx="30" ry="20" fill="#7A5220" opacity="0.4" filter="url(#softBlurSmall)" />
    </g>
    <circle r="27" fill="none" stroke="#5A3414" stroke-width="2" opacity="0.6" />
    <g transform="translate(0 1)" filter="url(#dropTiny)">
      <rect x="-16" y="-21" width="32" height="42" rx="5" fill="url(#calcBody)" stroke="#2E1A08" stroke-width="1.2" />
      <rect x="-15" y="-20" width="30" height="4" rx="2" fill="#A8794A" opacity="0.6" />
      <rect x="-12" y="-17" width="24" height="11" rx="1.5" fill="url(#calcScreen)" stroke="#2E1A08" stroke-width="1" />
      <rect x="-11" y="-16" width="10" height="3" rx="1.5" fill="#FFFFFF" opacity="0.7" />
      <rect x="-12" y="-1" width="6" height="6" rx="1.4" fill="url(#calcKey)" stroke="#2E1A08" stroke-width="0.8" />
      <rect x="-3" y="-1" width="6" height="6" rx="1.4" fill="url(#calcKey)" stroke="#2E1A08" stroke-width="0.8" />
      <rect x="6" y="-1" width="6" height="6" rx="1.4" fill="url(#calcKey)" stroke="#2E1A08" stroke-width="0.8" />
      <rect x="-12" y="8" width="6" height="6" rx="1.4" fill="url(#calcKey)" stroke="#2E1A08" stroke-width="0.8" />
      <rect x="-3" y="8" width="6" height="6" rx="1.4" fill="url(#calcKey)" stroke="#2E1A08" stroke-width="0.8" />
      <rect x="6" y="8" width="6" height="6" rx="1.4" fill="url(#calcKey)" stroke="#2E1A08" stroke-width="0.8" />
    </g>
  </g>

</svg>
